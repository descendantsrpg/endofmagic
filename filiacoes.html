@import url("https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap");
:root{--red:#a51d36;--dark:#2b171b;--muted:#6f555a;--line:rgba(165,29,54,.18)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--dark);font-family:"Comfortaa",sans-serif;font-weight:300}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px 0}
.container{width:min(1120px,calc(100% - 32px));margin:auto}
.brand{display:flex;justify-content:center;align-items:center}
.brand img{width:min(330px,72vw);height:auto;display:block}
main{padding:52px 0 75px}
.hero{text-align:center;margin-bottom:35px}.hero h1{margin:0 0 10px;color:var(--red);font-weight:300;font-size:clamp(2rem,5vw,3.6rem)}.hero p{margin:0;color:var(--muted)}
.groups{display:grid;gap:18px}.group{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 6px 20px rgba(124,18,38,.06)}
.group h2{margin:0;color:var(--red);font-size:1.35rem;font-weight:400}
.story{margin-top:18px;padding-top:18px;border-top:1px solid rgba(165,29,54,.1)}.story h3{margin:0 0 12px;color:var(--dark);font-weight:400}
.affs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.aff{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;transition:.2s}.aff:hover{transform:translateY(-2px);border-color:var(--red)}
.aff img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;margin-bottom:10px}.name{color:var(--red);font-weight:500;font-size:.9rem;line-height:1.35}.count{font-size:1.05rem!important;font-weight:700!important;color:#2b171b!important;margin-top:5px;line-height:1.15}.empty{text-align:center;color:var(--muted);padding:40px}.error{text-align:center;color:var(--red);padding:30px;border:1px solid var(--line);border-radius:12px}
.back{display:block;width:max-content;margin:35px auto 0;padding:11px 17px;border:1px solid var(--red);border-radius:999px;color:var(--red);text-decoration:none}
footer{text-align:center;padding:24px;color:var(--muted);border-top:1px solid var(--line);font-size:.8rem}
@media(max-width:900px){.affs{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.affs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:430px){.affs{grid-template-columns:1fr}.container{width:calc(100% - 24px)}}

<body>
<header><div class="container brand"><img src="./assets/logo-descendentes.png" alt="Descendentes RPG"></div></header>
<main class="container">
<section class="hero"><h1>Filiações</h1><p>Franquia → conto → filiação</p></section>
<section class="groups" id="groups"><div class="empty">Carregando filiações...</div></section>
<a class="back" href="index.html">Voltar à página inicial</a>
</main>
<footer>Descendentes RPG • Auradon Prep</footer>
<script type="module">
import {dbOnValue} from "./db-loader.js";
import{db}from"./firebase-init.js";
import{ref,onValue}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
const box=document.getElementById("groups");
let affiliations={},students={},affLoaded=false;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const errorMessage="Não foi possível carregar as filiações. Verifique a conexão e as regras de leitura do Firebase.";
function render(){
 const entries=Object.values(affiliations||{}).filter(Boolean), people=Object.values(students||{}).filter(Boolean);
 if(!entries.length){box.innerHTML='<div class="empty">Nenhuma filiação cadastrada no Firebase.</div>';return;}
 const groups={};
 entries.forEach(raw=>{
  const a=raw||{},studio=String(a.studio??a.franquia??"Sem franquia").trim()||"Sem franquia",story=String(a.story??a.conto??a.fairyTale??"Sem conto").trim()||"Sem conto",name=String(a.name??a.nome??a.filiation??"Sem nome").trim()||"Sem nome";
  groups[studio]??={};groups[studio][story]??=[];
  const current=people.filter(p=>{
   const pn=String(p.filiation??"").trim().toLowerCase(),ps=String(p.affiliationStudio??p.studio??"").trim().toLowerCase(),pt=String(p.affiliationStory??p.story??"").trim().toLowerCase();
   return pn===name.toLowerCase()&&(!ps||ps===studio.toLowerCase())&&(!pt||pt===story.toLowerCase());
  }).length;
  groups[studio][story].push({...a,name,current,maxChildren:Number(a.maxChildren??a.maxFilhos??3)});
 });
 box.innerHTML=Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0],"pt-BR",{sensitivity:"base"})).map(([studio,stories])=>
 `<article class="group"><h2>${esc(studio)}</h2>${Object.entries(stories).sort((a,b)=>a[0].localeCompare(b[0],"pt-BR",{sensitivity:"base"})).map(([story,items])=>
 `<div class="story"><h3>${esc(story)}</h3><div class="affs">${items.sort((a,b)=>a.name.localeCompare(b.name,"pt-BR",{sensitivity:"base"})).map(a=>
 `<div class="aff">${a.imageUrl?`<img src="${esc(a.imageUrl)}" alt="Foto de ${esc(a.name)}">`:""}<div class="name">${esc(a.name)}</div><div class="count ${a.current >= a.maxChildren ? "full" : ""}">(${String(a.current).padStart(2,"0")}/${String(a.maxChildren).padStart(2,"0")})</div>
${a.current >= a.maxChildren ? '<div class="filiation-full">Filiação Cheia</div>' : ''}</div>`).join("")}</div></div>`).join("")}</article>`).join("");
}
box.innerHTML='<div class="empty">Carregando filiações...</div>';
dbOnValue(onValue, ref(db,"site/filiacoes"),snap=>{affiliations=snap.val()||{};affLoaded=true;render()},err=>{console.error(err);box.innerHTML=`<div class="error">${errorMessage}</div>`});
dbOnValue(onValue, ref(db,"site/alunos"),snap=>{students=snap.val()||{};if(affLoaded)render()},err=>{console.error(err);if(affLoaded)render()});
setTimeout(()=>{if(box.textContent.includes("Carregando filiações"))box.innerHTML='<div class="error">O Firebase demorou para responder. Atualize a página e verifique as regras de leitura do Realtime Database.</div>'},10000);
</script>
<script type="module" src="./maintenance.js"></script>
</body>
</html>
