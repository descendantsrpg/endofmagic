<!doctype html><html lang="pt-BR"><head>
<script>document.documentElement.classList.add("maintenance-check-pending");</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alunos de Auradon • Descendentes RPG</title><link rel="stylesheet" href="./assets/site.css"><link rel="stylesheet" href="./assets/player.css">
<script>document.documentElement.classList.add('auth-pending');</script>
  <link rel="stylesheet" href="./assets/buttons-global.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./global-background.css">
<script type="module" src="./maintenance.js"></script>
</head><body class="player-body students-page"><header class="player-header"><div class="player-header-inner"><a class="player-brand" href="index.html"><img src="./assets/logo-descendentes.png" alt="Descendentes RPG"></a><nav class="player-nav"><a href="index.html">Início</a><a href="filiacoes.html">Filiações</a><a href="login.html">LOGIN</a><a class="primary" href="cadastro.html">CADASTRO</a></nav></div></header><main class="player-wrap"><section class="player-hero"><div><div class="kicker">AURADON PREP · REGISTRO DE ALUNOS</div><h1>Alunos de Auradon</h1><p>Os personagens aprovados aparecem aqui como registros oficiais da escola. As informações vêm diretamente das fichas aprovadas.</p></div></section><div id="list" class="player-grid"></div></main><script type="module">
import {db} from './firebase-init.js';
import {onValue,ref,update,runTransaction,get} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js';
import {createDbSyncLoader} from './db-sync-loader.js';

const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const normalize=v=>String(v??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const normalizeRga=v=>String(v??'').trim().toUpperCase();
const readRga=v=>normalizeRga(v?.rga||v?.RGA||v?.rgaId||'');
const list=document.getElementById('list');
const dbLoader=createDbSyncLoader('Carregamento do banco de dados');
dbLoader.show();
let legacyLoaded=false,fichasLoaded=false,syncRunning=false;
let legacyStudents={},approvedFichas={};

function findLinkedStudent(fichaId,ficha){
  if(ficha?.studentKey && legacyStudents[ficha.studentKey]) return [ficha.studentKey,legacyStudents[ficha.studentKey]];
  const match=Object.entries(legacyStudents||{}).find(([key,s])=>s && (
    s.fichaId===fichaId || s.studentKey===fichaId ||
    (ficha?.characterName && normalize(s.name)===normalize(ficha.characterName) && ficha.ownerUid && s.ownerUid===ficha.ownerUid)
  ));
  return match||null;
}

function mergeStudents(){
  const merged={...legacyStudents};
  Object.entries(approvedFichas||{}).forEach(([fichaId,f])=>{
    if(!f||f.status!=='aprovada')return;
    const linked=findLinkedStudent(fichaId,f);
    if(linked)return;
    const id='ficha_'+fichaId;
    merged[id]={
      name:f.characterName||f.name||'Personagem aprovado',type:f.royalRebel||f.type||'',age:Number(f.characterAge||f.age)||0,
      sexuality:f.sexuality||'',affiliationStudio:f.affiliationStudio||'',affiliationStory:f.affiliationStory||f.fairyTale||'',
      filiation:f.progenitors||f.filiation||'',fairyTale:f.fairyTale||f.affiliationStory||'',imageUrl:f.avatarUrl||f.imageUrl||null,
      powers:f.powers||[],personality:f.personality||'',history:f.history||'',activityPrimary:f.activityPrimary||'',fichaId,
      rga:readRga(f),ownerUid:f.ownerUid||'',updatedAt:f.approvedAt||f.updatedAt||f.createdAt||0
    };
  });
  return Object.entries(merged).map(([key,value])=>({key,...value}));
}

const rgaErrors=new Map();
const RGA_TIMEOUT=12000;
let rgaRetryTimer=null;

const withTimeout=(promise,ms=RGA_TIMEOUT)=>Promise.race([
  promise,
  new Promise((_,reject)=>setTimeout(()=>reject(new Error('Tempo esgotado ao sincronizar o RGA.')),ms))
]);

function isValidRga(value){
  const rga=readRga({rga:value});
  return /^RGA-[A-Z0-9]{6}-\d{3}$/.test(rga);
}

async function claimRga(ownerKey,candidate){
  const slot=ref(db,'site/rgaIndex/'+candidate);
  const tx=await withTimeout(runTransaction(slot,current=>current===null?ownerKey:current));
  return tx.committed && tx.snapshot.val()===ownerKey;
}

async function reserveGeneratedRga(ownerKey,blocked=new Set()){
  for(let attempt=0;attempt<80;attempt++){
    const candidate='RGA-'+Math.random().toString(36).slice(2,8).toUpperCase()+'-'+Math.floor(100+Math.random()*900);
    if(blocked.has(candidate))continue;
    try{
      if(await claimRga(ownerKey,candidate)){
        blocked.add(candidate);
        return candidate;
      }
    }catch(err){
      if(attempt>=2)throw err;
    }
  }
  throw new Error('Não foi possível reservar um RGA único.');
}

async function persistRga(path,rga){
  let lastError=null;
  for(let attempt=0;attempt<3;attempt++){
    try{
      await withTimeout(update(ref(db,path),{rga,updatedAt:Date.now()}));
      return;
    }catch(err){
      lastError=err;
      await new Promise(resolve=>setTimeout(resolve,350*(attempt+1)));
    }
  }
  throw lastError||new Error('Não foi possível salvar o RGA.');
}

async function releaseRga(rga,ownerKey){
  if(!rga)return;
  try{
    const slot=ref(db,'site/rgaIndex/'+rga);
    const tx=await withTimeout(runTransaction(slot,current=>current===ownerKey?null:current));
    return tx;
  }catch(_){/* reservation cleanup is best effort */}
}

async function ensureExistingRga(ownerKey,current,blocked){
  const rga=readRga({rga:current});
  if(!isValidRga(rga))return null;
  try{
    const claimed=await claimRga(ownerKey,rga);
    if(claimed){blocked.add(rga);return rga;}
    return null;
  }catch(err){
    throw err;
  }
}

function markRgaError(key,err){
  rgaErrors.set(key,String(err?.message||err||'Erro ao gerar RGA'));
}
function clearRgaError(key){rgaErrors.delete(key);}
function scheduleRgaRetry(){
  if(rgaRetryTimer)return;
  rgaRetryTimer=setTimeout(()=>{rgaRetryTimer=null;synchronizeRgas()},5000);
}

async function synchronizeRgas(){
  if(syncRunning||!legacyLoaded||!fichasLoaded)return;
  syncRunning=true;
  let retryNeeded=false;
  const blocked=new Set();
  const usedOwners=new Map();
  try{
    // Primeiro preservamos RGAs já existentes e válidos. Também registramos a reserva no índice.
    for(const [key,value] of Object.entries(legacyStudents||{})){
      if(!value)continue;
      try{
        let rga=readRga(value);
        const duplicate=rga&&usedOwners.has(rga)&&usedOwners.get(rga)!==key;
        if(rga&&isValidRga(rga)&&!duplicate){
          // Se o RGA já estiver reservado por outro aluno, este registro é o duplicado e receberá um novo.
          let claimed=false;
          try{claimed=await claimRga('aluno:'+key,rga);}catch(err){throw err;}
          if(claimed){
            blocked.add(rga);usedOwners.set(rga,key);clearRgaError(key);
            if(!value.rga||value.rga!==rga){
              await persistRga('site/alunos/'+key,rga);
              legacyStudents[key]={...value,rga};
            }
            continue;
          }
        }
        const newRga=await reserveGeneratedRga('aluno:'+key,blocked);
        try{
          await persistRga('site/alunos/'+key,newRga);
        }catch(err){
          await releaseRga(newRga,'aluno:'+key);
          throw err;
        }
        legacyStudents[key]={...value,rga:newRga,updatedAt:Date.now()};
        usedOwners.set(newRga,key);blocked.add(newRga);clearRgaError(key);
        render();
      }catch(err){
        retryNeeded=true;markRgaError(key,err);
        console.warn('RGA não atribuído ao aluno '+key,err);
      }
    }

    // Depois sincronizamos fichas aprovadas. Se houver aluno vinculado, o registro do aluno é a referência principal.
    for(const [fichaId,ficha] of Object.entries(approvedFichas||{})){
      if(!ficha||ficha.status!=='aprovada')continue;
      const linked=findLinkedStudent(fichaId,ficha);
      const fichaOwner='ficha:'+fichaId;
      try{
        let desired=linked?readRga(linked[1]):'';
        const fichaRga=readRga(ficha);
        if(linked&&desired&&isValidRga(desired)){
          const studentOwner='aluno:'+linked[0];
          if(!usedOwners.has(desired)){
            const claimed=await claimRga(studentOwner,desired);
            if(claimed){
              usedOwners.set(desired,linked[0]);
              blocked.add(desired);
            }else{
              desired='';
            }
          }else if(usedOwners.get(desired)!==linked[0]){
            desired='';
          }
        }else if(fichaRga&&isValidRga(fichaRga)&&!usedOwners.has(fichaRga)){
          desired=fichaRga;
          if(!await claimRga(fichaOwner,desired))desired='';
          if(desired){usedOwners.set(desired,fichaOwner);blocked.add(desired);}
        }
        if(!desired)desired=await reserveGeneratedRga(linked?'aluno:'+linked[0]:fichaOwner,blocked);

        if(linked){
          const [studentKey,student]=linked;
          if(readRga(student)!==desired){
            try{await persistRga('site/alunos/'+studentKey,desired);}catch(err){await releaseRga(desired,fichaOwner);throw err;}
            legacyStudents[studentKey]={...student,rga:desired,updatedAt:Date.now()};
          }
          clearRgaError(studentKey);
        }
        if(fichaRga!==desired){
          await persistRga('site/fichas/'+fichaId,desired);
          approvedFichas[fichaId]={...ficha,rga:desired,updatedAt:Date.now()};
        }
        clearRgaError('ficha_'+fichaId);
        render();
      }catch(err){
        retryNeeded=true;markRgaError(linked?linked[0]:'ficha_'+fichaId,err);
        console.warn('RGA não atribuído à ficha aprovada '+fichaId,err);
      }
    }
  }finally{
    syncRunning=false;
    render();
    if(retryNeeded)scheduleRgaRetry();
  }
}

function render(){
  const arr=mergeStudents();
  list.innerHTML=arr.length?arr.map(x=>{
    const type=String(x.type||x.royalRebel||'').trim();
    const isRoyal=type.toLowerCase()==='royal';
    const isRebel=type.toLowerCase()==='rebel';
    const alignment=isRoyal?'👑 Royal':(isRebel?'💀 Rebel':'—');
    const rga=readRga(x);
    const rgaError=rgaErrors.get(x.key);
    const rgaLabel=rga || (rgaError?'Sincronizando…':'Gerando…');
    return `<article class="official-student-card">
      <div class="official-student-photo-wrap"><img class="official-student-photo" src="${esc(x.imageUrl||'./assets/auradon-prep.png')}" alt="Foto de ${esc(x.name||'Personagem')}"></div>
      <div class="official-student-body">
        <div class="official-student-kicker">AURADON PREP · IDENTIFICAÇÃO ESTUDANTIL</div>
        <h2 class="official-student-name" title="${esc(x.name||'Sem nome')}">${esc(x.name||'Sem nome')}</h2>
        <div class="official-rga"><span>RGA</span><strong>${esc(rgaLabel)}</strong></div>
        <div class="official-student-grid">
          <div><small>Idade</small><strong>${esc(x.age||'—')}</strong></div>
          <div><small>Progenitores</small><strong title="${esc(x.filiation||x.progenitors||'—')}">${esc(x.filiation||x.progenitors||'—')}</strong></div>
          <div class="official-wide"><small>Conto de Fadas</small><strong title="${esc(x.fairyTale||x.affiliationStory||'—')}">${esc(x.fairyTale||x.affiliationStory||'—')}</strong></div>
        </div>
        <div class="official-alignment ${isRoyal?'royal':(isRebel?'rebel':'unknown')}"><span>${alignment}</span></div>
        <div class="official-student-footer"><span>REGISTRO OFICIAL</span><span>AURADON PREP</span></div>
      </div>
    </article>`;
  }).join(''):'<div class="empty-player">Nenhum aluno cadastrado ou aprovado foi publicado ainda.</div>';
}

onValue(ref(db,'site/alunos'),s=>{legacyStudents=s.val()||{};legacyLoaded=true;render();synchronizeRgas();},e=>{console.error(e);legacyLoaded=true;render();if(fichasLoaded)dbLoader.hide()});
onValue(ref(db,'site/fichas'),s=>{const all=s.val()||{};approvedFichas=Object.fromEntries(Object.entries(all).filter(([,f])=>f&&f.status==='aprovada'));fichasLoaded=true;render();synchronizeRgas();if(legacyLoaded)dbLoader.hide()},e=>{console.error(e);fichasLoaded=true;if(legacyLoaded)dbLoader.hide()});
</script><script type="module" src="./assets/account-menu.js"></script></body></html>
