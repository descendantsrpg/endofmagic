:root{--red:#a51d36;--text:#2b171b;--muted:#6f555a;--line:rgba(165,29,54,.18)}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--text);font-family:"Comfortaa",sans-serif;font-weight:300}
header{border-bottom:1px solid var(--line);padding:22px 0;text-align:center;background:#fff}header img{width:min(360px,75vw)}
.container{width:min(1100px,calc(100% - 32px));margin:auto}
main{padding:52px 0 70px}.intro{text-align:center;margin-bottom:32px}.intro h1{color:var(--red);font-size:clamp(2.2rem,5vw,3.8rem);font-weight:300;margin:0 0 10px}.intro p{color:var(--muted);margin:0}
.filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:28px}.filter{font-family:inherit;font-weight:300;background:#fff;color:var(--red);border:1px solid rgba(165,29,54,.3);border-radius:999px;padding:9px 15px;cursor:pointer}.filter.active,.filter:hover{background:var(--red);color:#fff}
.students{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.student{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 6px 20px rgba(124,18,38,.06)}.student img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.student-body{padding:15px}.type{color:var(--red);font-size:.7rem;letter-spacing:.08em}.student h2{color:var(--text);font-weight:400;font-size:1.12rem;margin:7px 0 12px}.data{display:grid;gap:6px;color:var(--muted);font-size:.82rem;line-height:1.45}.data b{color:var(--text);font-weight:400}
.empty{text-align:center;border:1px dashed var(--line);border-radius:16px;padding:60px 20px;color:var(--muted);grid-column:1/-1}.empty strong{display:block;color:var(--red);font-size:1.15rem;font-weight:400;margin-bottom:8px}.empty span{font-size:.85rem}
.back{display:block;width:max-content;margin:35px auto 0;padding:11px 17px;border:1px solid var(--red);border-radius:999px;color:var(--red);text-decoration:none}
footer{text-align:center;padding:24px;border-top:1px solid var(--line);color:var(--muted);font-size:.78rem}

<div id="dbLoadingOverlay" class="is-loading" role="status" aria-live="polite" aria-label="Aguarde, estamos carregando o banco de dados">
  <img src="assets/db-loading.png" alt="Aguarde, estamos carregando o banco de dados">
</div>

<body>
<header><img src="./assets/logo-descendentes.png" alt="Descendentes RPG"></header>
<main class="container">
<section class="intro"><h1>Alunos</h1><p>Conheça os estudantes de Auradon Prep.</p></section>
<div class="filters"><button class="filter active" data-filter="Todos">Todos</button><button class="filter" data-filter="Royal">Royals</button><button class="filter" data-filter="Rebel">Rebels</button></div>
<section class="students" id="students"><div class="empty"><strong>Nenhum aluno cadastrado no Firebase.</strong><span>Quando um aluno for cadastrado pelo painel administrativo, ele aparecerá aqui automaticamente.</span></div></section>
<a class="back" href="index.html">Voltar à página inicial</a>
</main>
<footer>Descendentes RPG • Auradon Prep</footer>
<script type="module">
import {dbOnValue} from "./db-loader.js";
import{db}from"./firebase-init.js";
import{ref,onValue}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
const container=document.getElementById("students");let allStudents=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function render(filter="Todos"){
 const students=allStudents.filter(s=>filter==="Todos"||s.type===filter);
 if(!students.length){
  container.innerHTML='<div class="empty"><strong>Nenhum aluno cadastrado no Firebase.</strong><span>Quando um aluno for cadastrado pelo painel administrativo, ele aparecerá aqui automaticamente.</span></div>';
  return;
 }
 container.innerHTML=students.map(s=>`<article class="student">${s.imageUrl?`<img src="${s.imageUrl}" alt="Foto de ${esc(s.name)}">`:""}<div class="student-body"><div class="type">${esc(s.type||"")}</div><h2>${esc(s.name||"Sem nome")}</h2><div class="data"><div><b>Idade:</b> ${esc(s.age||"")}</div><div><b>Sexualidade:</b> ${esc(s.sexuality||"")}</div><div><b>Filiação:</b> ${esc(s.filiation||"")}</div><div><b>Conto de Fada:</b> ${esc(s.fairyTale||"")}</div></div></div></article>`).join("");
}
document.querySelectorAll(".filter").forEach(btn=>btn.onclick=()=>{document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render(btn.dataset.filter)});
dbOnValue(onValue, ref(db,"site/alunos"),snap=>{const data=snap.val()||{};allStudents=Object.values(data).sort((a,b)=>(a.name||"").localeCompare(b.name||""));render(document.querySelector(".filter.active").dataset.filter)},err=>{console.error(err);container.innerHTML='<div class="empty"><strong>Não foi possível carregar os alunos.</strong><span>Verifique as regras de leitura do Firebase Realtime Database.</span></div>'});
</script>
<script type="module" src="./maintenance.js"></script>
</body>
</html>
