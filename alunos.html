<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alunos de Auradon • Descendentes RPG</title><link rel="stylesheet" href="./assets/site.css"><link rel="stylesheet" href="./assets/player.css">
<script>document.documentElement.classList.add('auth-pending');</script>
  <link rel="stylesheet" href="./assets/buttons-global.css">
</head><body class="player-body"><header class="player-header"><div class="player-header-inner"><a class="player-brand" href="index.html"><img src="./assets/logo-descendentes.png" alt="Descendentes RPG"></a><nav class="player-nav"><a href="index.html">Início</a><a href="filiacoes.html">Filiações</a><a href="login.html">LOGIN</a><a class="primary" href="cadastro.html">CADASTRO</a></nav></div></header><main class="player-wrap"><section class="player-hero"><div><div class="kicker">AURADON PREP · REGISTRO DE ALUNOS</div><h1>Alunos de Auradon</h1><p>Os personagens aprovados aparecem aqui como registros oficiais da escola. As informações vêm diretamente das fichas aprovadas.</p></div></section><div id="list" class="player-grid"></div></main><script type="module">import {db} from './firebase-init.js';import {onValue,ref} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js';import {createDbSyncLoader} from './db-sync-loader.js';const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const list=document.getElementById('list');const dbLoader=createDbSyncLoader('Carregando alunos diretamente do Firebase...');dbLoader.show();let legacyLoaded=false;let fichasLoaded=false;
let legacyStudents={};let approvedFichas={};
function normalize(v){return String(v??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function mergeStudents(){
  // A fonte principal continua sendo site/alunos, preservando integralmente os registros antigos.
  const merged={...legacyStudents};
  // Fichas aprovadas são uma segunda origem. Só acrescentamos uma ficha quando ela ainda
  // não estiver representada em site/alunos; nenhum registro existente é alterado ou removido.
  Object.entries(approvedFichas||{}).forEach(([fichaId,f])=>{
    if(!f||f.status!=='aprovada')return;
    const exists=Object.entries(legacyStudents||{}).some(([key,s])=>{
      if(!s)return false;
      return s.fichaId===fichaId || s.studentKey===fichaId ||
        (f.studentKey && key===f.studentKey) ||
        (f.characterName && normalize(s.name)===normalize(f.characterName) && f.ownerUid && s.ownerUid===f.ownerUid);
    });
    if(exists)return;
    const id='ficha_'+fichaId;
    merged[id]={
      name:f.characterName||f.name||'Personagem aprovado',
      type:f.royalRebel||f.type||'',
      age:Number(f.characterAge||f.age)||0,
      sexuality:f.sexuality||'',
      affiliationStudio:f.affiliationStudio||'',
      affiliationStory:f.affiliationStory||f.fairyTale||'',
      filiation:f.progenitors||f.filiation||'',
      fairyTale:f.fairyTale||f.affiliationStory||'',
      imageUrl:f.avatarUrl||f.imageUrl||null,
      powers:f.powers||[],
      personality:f.personality||'',
      history:f.history||'',
      activityPrimary:f.activityPrimary||'',
      fichaId,
      ownerUid:f.ownerUid||'',
      updatedAt:f.approvedAt||f.updatedAt||f.createdAt||0
    };
  });
  return Object.values(merged);
}
function render(){
  const arr=mergeStudents();
  list.innerHTML=arr.length?arr.map(x=>{const powers=Array.isArray(x.powers)?x.powers:(x.powers?[x.powers]:[]);return `<article class="student-card"><img class="student-photo" src="${esc(x.imageUrl||'./assets/auradon-prep.png')}" alt="Foto de ${esc(x.name)}"><div class="student-content"><h2 class="student-name">${esc(x.name)}</h2><div class="student-origin">Descendente de ${esc(x.filiation||'origem não definida')}</div><div class="identity-grid"><div class="identity-cell"><small>Alinhamento</small><strong>${esc(x.type||'—')}</strong></div><div class="identity-cell"><small>Origem</small><strong>${esc(x.affiliationStory||'—')}</strong></div><div class="identity-cell"><small>Poderes</small><strong>${esc(powers.slice(0,2).join(' · ')||'—')}</strong></div><div class="identity-cell"><small>Atividade</small><strong>${esc(x.activityPrimary||'—')}</strong></div></div><div class="student-quote">“${esc(String(x.personality||'Registro oficial de Auradon.').split(/\n+/).filter(Boolean)[0].slice(0,180))}”</div><div class="student-footer"><span>OFFICIAL RPG CARD</span><span>VERIFIED AURADON</span></div></div></article>`}).join(''):'<div class="empty-player">Nenhum aluno cadastrado ou aprovado foi publicado ainda.</div>';
}
onValue(ref(db,'site/alunos'),s=>{legacyStudents=s.val()||{};legacyLoaded=true;render();if(fichasLoaded)dbLoader.hide()},e=>{console.error(e);legacyLoaded=true;render();if(fichasLoaded)dbLoader.hide()});
onValue(ref(db,'site/fichas'),s=>{const all=s.val()||{};approvedFichas=Object.fromEntries(Object.entries(all).filter(([,f])=>f&&f.status==='aprovada'));fichasLoaded=true;render();if(legacyLoaded)dbLoader.hide()},e=>{console.error(e);fichasLoaded=true;if(legacyLoaded)dbLoader.hide()});</script><script type="module" src="./assets/account-menu.js"></script></body></html>
