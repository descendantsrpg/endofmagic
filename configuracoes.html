<main class="player-wrap"><section class="player-panel"><div class="kicker">AURADON PREP · CONTA</div><h1>Configurações de cadastro</h1><p>Consulte as informações vinculadas à sua conta autenticada. Alterações futuras poderão ser adicionadas aqui sem afetar suas fichas.</p><div class="ficha-grid" style="margin-top:22px"><div class="field"><label>Seu Nome</label><input id="name" readonly></div><div class="field"><label>Usuário</label><input id="username" readonly></div><div class="field"><label>ID da conta</label><input id="uid" readonly></div></div><div id="error" class="ficha-error"></div></section></main>

import {requireAuth} from './assets/auth.js'; import {db} from './firebase-init.js'; import {get,ref} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js';
