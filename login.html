<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • Descendentes RPG</title><link rel="stylesheet" href="./assets/site.css"><link rel="stylesheet" href="./assets/player.css"><link rel="stylesheet" href="./assets/ficha-system.css">
<script>document.documentElement.classList.add('auth-pending');</script>
  <link rel="stylesheet" href="./assets/buttons-global.css">
</head>
<body class="player-body"><main class="ficha-shell"><div class="ficha-top"><a href="index.html"><img src="./assets/logo-descendentes.png" alt="Descendentes RPG"></a><a class="player-button secondary" href="cadastro.html">Criar conta</a></div><section class="ficha-card"><div class="kicker">AURADON PREP · PORTÃO DE ENTRADA</div><h1>Entrar em Auradon</h1><p class="subtitle">Acesse sua Home para continuar rascunhos, criar personagens e acompanhar suas fichas.</p><form id="loginForm" class="ficha-form"><div class="field"><label for="username">*Usuário</label><input id="username" required autocomplete="username"></div><div class="field"><label for="password">*Senha</label><input id="password" type="password" required autocomplete="current-password"></div><div id="error" class="ficha-error"></div><div class="ficha-actions"><a class="ficha-button secondary" href="index.html">Voltar</a><button class="ficha-button" type="submit">Entrar ✦</button></div></form></section></main><script type="module">import {loginPlayer} from './assets/auth.js';const f=document.getElementById('loginForm'),e=document.getElementById('error');f.onsubmit=async x=>{x.preventDefault();e.textContent='Entrando...';try{await loginPlayer(document.getElementById('username').value,document.getElementById('password').value);location.replace('home.html')}catch(err){e.textContent='Usuário ou senha incorretos.'}};</script><script type="module" src="./assets/account-menu.js"></script></body></html>
