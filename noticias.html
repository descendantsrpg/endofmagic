<!doctype html>
<html lang="pt-BR"><head>
<link rel="preconnect" href="https://fonts.googleapis.com">

<title>Notícias — Jornal da Auradon Prep</title><style>
:root{
  --wine:#5d1728;
  --wine-dark:#21070e;
  --gold:#d5ad5a;
  --cream:#fff8e8;
  --text:#eadfe0;
  --muted:#c8b9bc;
  --line:rgba(213,173,90,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  color:var(--cream);
  font-family:Georgia,"Times New Roman",serif;
  background:
    radial-gradient(circle at 20% 10%,rgba(213,173,90,.12),transparent 30%),
    radial-gradient(circle at 85% 40%,rgba(93,23,40,.4),transparent 35%),
    linear-gradient(145deg,#100509,#2a0b13 55%,#100509);
}
a{text-decoration:none;color:inherit}
.container{width:min(1120px,calc(100% - 36px));margin:auto}
header{
  border-bottom:1px solid var(--line);
  background:rgba(16,5,9,.82);
  padding:18px 0;
}
.brand{
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);letter-spacing:.18em;text-transform:uppercase;
  font-size:.78rem;
}
main{padding:70px 0 90px}
.hero{text-align:center;max-width:850px;margin:auto}
.logo{width:min(330px,75vw);margin-bottom:34px}
h1{font-size:clamp(2.4rem,5vw,4.6rem);line-height:1.05;margin-bottom:24px}
.intro{
  max-width:760px;margin:auto;color:var(--text);
  font-size:1.06rem;line-height:1.8;
}
.menu{
  margin:60px auto 0;
  display:grid;grid-template-columns:repeat(4,1fr);gap:16px;
}
.menu a{
  min-height:130px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:24px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,248,232,.045);
  color:var(--cream);
  font-size:1.15rem;font-weight:bold;
  transition:.2s;
}
.menu a:hover{
  transform:translateY(-4px);
  background:rgba(93,23,40,.65);
  border-color:var(--gold);
  color:var(--gold);
}
.page{
  max-width:900px;margin:auto;text-align:center;
}
.page h1{color:var(--gold)}
.page p{color:var(--muted);line-height:1.8;margin:16px 0}
.back{
  display:inline-block;margin-top:30px;padding:12px 18px;
  border:1px solid var(--gold);border-radius:999px;color:var(--gold);
}
footer{
  text-align:center;padding:25px;color:#9f9195;
  border-top:1px solid rgba(213,173,90,.15);font-size:.8rem
}
@media(max-width:800px){.menu{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.menu{grid-template-columns:1fr}}

/* ===== RESPONSIVIDADE PC / TABLET / CELULAR ===== */
html { -webkit-text-size-adjust: 100%; }
body { overflow-x: hidden; }

.container {
  width: min(1120px, calc(100% - 40px));
}

img {
  max-width: 100%;
  height: auto;
}

main {
  min-height: calc(100vh - 130px);
}

.hero {
  padding-inline: 0;
}

.menu a {
  min-height: 132px;
  -webkit-tap-highlight-color: transparent;
}

/* Telas grandes */
@media (min-width: 1200px) {
  .container { width: min(1180px, calc(100% - 64px)); }
  main { padding-top: 90px; }
}

/* Notebook / tablet horizontal */
@media (max-width: 1024px) {
  .container { width: min(900px, calc(100% - 36px)); }
  main { padding-top: 58px; }
  .menu { gap: 14px; }
  .menu a { min-height: 120px; }
}

/* Tablet vertical */
@media (max-width: 800px) {
  header { padding: 16px 0; }
  .container { width: min(720px, calc(100% - 32px)); }

  main { padding: 55px 0 70px; }

  .logo {
    width: min(300px, 72vw);
    margin-bottom: 28px;
  }

  h1 {
    font-size: clamp(2.25rem, 8vw, 3.8rem);
  }

  .intro {
    font-size: 1rem;
    line-height: 1.75;
  }

  .menu {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin-top: 46px;
  }

  .menu a {
    min-height: 112px;
    padding: 20px 14px;
    font-size: 1.05rem;
  }
}

/* Celular */
@media (max-width: 560px) {
  .container {
    width: calc(100% - 28px);
  }

  header {
    padding: 14px 0;
  }

  .brand {
    font-size: .68rem;
    letter-spacing: .13em;
  }

  main {
    padding: 42px 0 58px;
  }

  .hero,
  .page {
    width: 100%;
  }

  .logo {
    width: min(260px, 78vw);
    margin-bottom: 24px;
  }

  h1 {
    font-size: clamp(2rem, 11vw, 3rem);
    margin-bottom: 18px;
  }

  .intro,
  .page p {
    font-size: .96rem;
    line-height: 1.72;
  }

  .menu {
    grid-template-columns: 1fr;
    gap: 11px;
    margin-top: 34px;
  }

  .menu a {
    min-height: 72px;
    padding: 18px 16px;
    border-radius: 15px;
    font-size: 1rem;
  }

  .back {
    margin-top: 24px;
    padding: 12px 17px;
  }

  footer {
    padding: 22px 14px;
    line-height: 1.5;
  }
}

/* Celulares muito pequenos */
@media (max-width: 360px) {
  .container { width: calc(100% - 22px); }

  .brand {
    font-size: .62rem;
    letter-spacing: .1em;
  }

  main { padding-top: 34px; }

  .logo {
    width: 72vw;
  }

  .menu a {
    min-height: 66px;
  }
}

/* Acessibilidade / preferência de movimento */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .menu a { transition: none; }
}


/* ===== MENU REFINADO ===== */
.menu {
  width: min(760px, 100%);
  margin: 42px auto 0;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 11px;
}

.menu a {
  min-height: 72px;
  padding: 15px 12px;
  border-radius: 13px;
  border: 1px solid rgba(213,173,90,.22);
  background: linear-gradient(
    145deg,
    rgba(255,248,232,.075),
    rgba(255,248,232,.025)
  );
  color: #eee3d2;
  font-size: .94rem;
  font-weight: 600;
  letter-spacing: .025em;
  box-shadow: 0 8px 24px rgba(0,0,0,.14);
  position: relative;
  overflow: hidden;
}

.menu a::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    120deg,
    transparent 20%,
    rgba(213,173,90,.09),
    transparent 80%
  );
  transform: translateX(-110%);
  transition: transform .35s ease;
}

.menu a:hover::before {
  transform: translateX(110%);
}

.menu a:hover {
  transform: translateY(-3px);
  border-color: rgba(213,173,90,.58);
  background: linear-gradient(
    145deg,
    rgba(93,23,40,.72),
    rgba(93,23,40,.42)
  );
  color: #f4d58a;
  box-shadow: 0 12px 30px rgba(0,0,0,.25);
}

.menu a:active {
  transform: translateY(-1px);
}

@media (max-width: 800px) {
  .menu {
    width: min(620px, 100%);
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .menu a {
    min-height: 68px;
    font-size: .92rem;
  }
}

@media (max-width: 560px) {
  .menu {
    width: min(340px, 100%);
    grid-template-columns: 1fr;
    gap: 9px;
    margin-top: 30px;
  }

  .menu a {
    min-height: 58px;
    padding: 13px 16px;
    border-radius: 12px;
    font-size: .91rem;
  }
}


/* ===== SLIDES DO JORNAL ===== */
.news-section{
  width:min(900px,100%);
  margin:72px auto 0;
  padding:34px 0 8px;
  border-top:1px solid rgba(213,173,90,.18);
}
.news-header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
}
.news-header h2{
  color:var(--cream);
  font-size:clamp(1.7rem,4vw,2.6rem);
  margin-top:6px;
}
.news-controls{display:flex;gap:7px}
.news-btn{
  width:36px;height:36px;
  border:1px solid rgba(213,173,90,.35);
  border-radius:50%;
  background:rgba(255,248,232,.04);
  color:var(--gold);
  font-size:1.35rem;
  line-height:1;
  cursor:pointer;
  transition:.2s;
}
.news-btn:hover{
  background:rgba(93,23,40,.7);
  border-color:var(--gold);
  transform:translateY(-2px);
}
.news-slider{
  position:relative;
  min-height:190px;
  overflow:hidden;
  border:1px solid rgba(213,173,90,.22);
  border-radius:18px;
  background:linear-gradient(145deg,rgba(255,248,232,.065),rgba(255,248,232,.025));
}
.news-slide{
  display:none;
  grid-template-columns:72px 1fr;
  gap:24px;
  align-items:start;
  padding:30px;
}
.news-slide.active{
  display:grid;
  animation:newsFade .35s ease;
}
.news-number{
  color:rgba(213,173,90,.65);
  font-size:1.65rem;
  font-weight:bold;
}
.news-tag{
  color:var(--gold);
  font-size:.68rem;
  letter-spacing:.16em;
  font-weight:bold;
}
.news-slide h3{
  margin:8px 0 10px;
  font-size:clamp(1.25rem,3vw,1.7rem);
  line-height:1.2;
}
.news-slide p{
  color:var(--muted);
  line-height:1.65;
  font-size:.94rem;
  max-width:680px;
}
.news-dots{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:13px;
}
.news-dot{
  width:6px;height:6px;
  border-radius:50%;
  border:0;
  background:rgba(213,173,90,.28);
  cursor:pointer;
  padding:0;
}
.news-dot.active{background:var(--gold);transform:scale(1.25)}
@keyframes newsFade{
  from{opacity:0;transform:translateX(10px)}
  to{opacity:1;transform:translateX(0)}
}
@media(max-width:560px){
  .news-section{margin-top:52px}
  .news-header{align-items:center}
  .news-slide{
    grid-template-columns:1fr;
    gap:8px;
    padding:24px 20px;
  }
  .news-number{font-size:1rem}
  .news-slider{min-height:245px}
  .news-btn{width:34px;height:34px}
}


/* ===== NOTÍCIAS DINÂMICAS ===== */
.news-more{
  display:block;
  width:max-content;
  margin:17px auto 0;
  color:var(--gold);
  font-size:.82rem;
  transition:.2s;
}
.news-more:hover{color:#f4d58a;transform:translateX(3px)}
.news-slide{display:none}
.news-slide.active{display:grid}


.blog{width:min(980px,100%);margin:auto}
.blog-head{text-align:center;margin-bottom:42px}
.blog-head h1{margin-bottom:15px}
.blog-head p{max-width:680px;margin:auto;color:var(--muted);line-height:1.7}
.news-list{display:grid;gap:18px}
.post{display:grid;grid-template-columns:110px 1fr;gap:25px;padding:28px;border:1px solid rgba(213,173,90,.22);border-radius:18px;background:linear-gradient(145deg,rgba(255,248,232,.065),rgba(255,248,232,.025))}
.post-meta{color:var(--gold);font-size:.72rem;letter-spacing:.12em;font-weight:bold}
.post-date{color:#a99a9e;font-size:.78rem;margin-top:8px}
.post h2{font-size:1.55rem;line-height:1.2;margin:7px 0 12px}
.post-excerpt{color:#d8cbcd;line-height:1.65;margin-bottom:15px}
.post-content{color:var(--muted);line-height:1.75;padding-top:15px;border-top:1px solid rgba(213,173,90,.13)}
@media(max-width:600px){.post{grid-template-columns:1fr;padding:22px}.post-meta{display:flex;justify-content:space-between}.post h2{font-size:1.3rem}}
